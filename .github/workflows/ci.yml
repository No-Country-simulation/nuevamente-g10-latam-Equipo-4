name: Atlas checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ATLAS_INTERNAL_TOKEN: ci-test-token-with-at-least-24-characters
      ATLAS_APP_MODE: local
      ATLAS_TENANT_ID: ci-workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cognition/requirements.lock
      - run: npm ci
      - run: python -m venv .venv && .venv/bin/pip install -r services/cognition/requirements.lock
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compile native Eve workflows without provider credentials
        run: npm run agent:build -w @atlas/api
      - name: Exercise real local services in extractive mode
        env:
          ATLAS_AGENT_RUNTIME: extractive
        shell: bash
        run: |
          cp .env.example .env
          npm run dev > /tmp/atlas-ci.log 2>&1 &
          task_pid=$!
          trap 'kill "$task_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/atlas/bootstrap > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          npm run test:proxy -w @atlas/web
