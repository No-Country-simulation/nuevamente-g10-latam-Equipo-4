<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Atlas em movimento: da fonte ao estudo com referências</title>
  <desc id="desc">Ilustração conceitual animada em quatro etapas: adicionar uma fonte, recuperar evidências, coordenar agentes e ações e entregar material com citações. O Dreamer trabalha com experiências consentidas e avaliação. Geração por LLM e Jev dependem de configuração; sem LLM, o modo é extrativo. Não é telemetria ou captura de uma execução. A animação para quando o sistema solicita movimento reduzido.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#111316"/><stop offset="1" stop-color="#08090A"/></linearGradient>
    <radialGradient id="ember"><stop stop-color="#FF4F38" stop-opacity=".18"/><stop offset="1" stop-color="#FF4F38" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l5 3-5 3" fill="none" stroke="#AFA698" stroke-width="1.5"/></marker>
    <style>
      .label{font:11px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#AFA698}
      .heading{font:21px Georgia,serif;fill:#E9E1D4}
      .body{font:13px Arial,Helvetica,sans-serif;fill:#B8B6B1}
      .micro{font:10px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#AFA698}
      .icon{fill:none;stroke:#FF735F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#FF735F;stroke-width:2;stroke-dasharray:4 10;animation:travel 1.8s linear infinite}
      .glow{fill:none;stroke:#FF735F;stroke-width:1.6;opacity:.12;animation:spotlight 12s ease-in-out infinite}
      .second{animation-delay:3s}.third{animation-delay:6s}.fourth{animation-delay:9s}
      .star{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes travel{to{stroke-dashoffset:-28}}
      @keyframes spotlight{0%,20%{opacity:.9}26%,100%{opacity:.12}}
      @keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.flow,.glow,.star{animation:none}.glow{opacity:.3}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="658" rx="24" fill="url(#canvas)" stroke="#30343B"/>
  <ellipse cx="1000" cy="90" rx="210" ry="150" fill="url(#ember)"/>
  <g transform="translate(46 42)">
    <ellipse cx="17" cy="13" rx="22" ry="10" transform="rotate(-42 17 13)" fill="none" stroke="#8B7B6D"/>
    <circle cx="2" cy="27" r="5" fill="#E9E1D4"/><circle cx="34" cy="0" r="4" fill="#FF4F38"/>
    <text x="58" y="20" font-family="Georgia,serif" font-size="35" fill="#E9E1D4">atlas</text>
  </g>
  <text class="label" x="1150" y="58" text-anchor="end">AGENTES PARA A EDUCAÇÃO</text>
  <text x="44" y="134" font-family="Georgia,serif" font-size="39" fill="#E9E1D4">Da sua fonte ao próximo <tspan fill="#FF735F">insight.</tspan></text>
  <text class="body" x="46" y="170">Um percurso para explorar, conferir e praticar — com evidências em cada etapa.</text>
  <g fill="#111316" stroke="#30343B">
    <rect x="44" y="210" width="252" height="266" rx="16"/>
    <rect x="330" y="210" width="252" height="266" rx="16"/>
    <rect x="616" y="210" width="252" height="266" rx="16"/>
    <rect x="902" y="210" width="252" height="266" rx="16"/>
  </g>
  <rect class="glow" x="44" y="210" width="252" height="266" rx="16"/>
  <rect class="glow second" x="330" y="210" width="252" height="266" rx="16"/>
  <rect class="glow third" x="616" y="210" width="252" height="266" rx="16"/>
  <rect class="glow fourth" x="902" y="210" width="252" height="266" rx="16"/>
  <g fill="none" stroke="#716B61" stroke-width="1" marker-end="url(#arrow)"><path d="M298 343h28"/><path d="M584 343h28"/><path d="M870 343h28"/></g>
  <path class="flow" d="M298 343h25 M584 343h25 M870 343h25"/>
  <g transform="translate(66 235)">
    <text class="label" y="0">01 / ADICIONAR</text>
    <g class="icon" transform="translate(0 24)"><path d="M2 0h22l8 8v34H2z M24 0v10h8 M9 20h16 M9 27h16 M9 34h10"/></g>
    <text class="heading" y="104">Sua biblioteca</text>
    <text class="body" y="133"><tspan x="0">PDF textual, Markdown e TXT.</tspan><tspan x="0" dy="21">Até 80 MiB por documento.</tspan><tspan x="0" dy="21">Envio e remoção sob controle.</tspan></text>
    <text class="micro" y="218">FONTES DO ESTUDANTE</text>
  </g>
  <g transform="translate(352 235)">
    <text class="label" y="0">02 / RECUPERAR</text>
    <g class="icon" transform="translate(0 24)"><circle cx="17" cy="17" r="15"/><path d="M28 28l12 12 M10 12h14 M10 18h14 M10 24h8"/></g>
    <text class="heading" y="104">Encontrar respaldo</text>
    <text class="body" y="133"><tspan x="0">Trechos e contexto das fontes.</tspan><tspan x="0" dy="21">Fontes autorizadas do workspace.</tspan><tspan x="0" dy="21">Relevância com Jev opcional.</tspan></text>
    <text class="micro" y="218">RAG + EVIDÊNCIAS</text>
  </g>
  <g transform="translate(638 235)">
    <text class="label" y="0">03 / COORDENAR</text>
    <g class="icon" transform="translate(0 24)"><path d="M7 9l24 1-12 25z"/><circle cx="7" cy="9" r="5" fill="#111316"/><circle cx="31" cy="10" r="5" fill="#111316"/><circle cx="19" cy="35" r="5" fill="#111316"/></g>
    <text class="heading" y="104">Agentes e ações</text>
    <text class="body" y="133"><tspan x="0">Brains escolhem a abordagem.</tspan><tspan x="0" dy="21">Invokta aplica regras às ações.</tspan><tspan x="0" dy="21">Eve orquestra o perfil de agentes.</tspan></text>
    <text class="micro" y="218">GERAÇÃO REMOTA CONFIGURÁVEL</text>
  </g>
  <g transform="translate(924 235)">
    <text class="label" y="0">04 / APRENDER</text>
    <g class="icon" transform="translate(0 24)"><path d="M2 1h36v29H13L2 39z M10 12l6 6 13-12 M10 24h20"/></g>
    <text class="heading" y="104">Estudar e conferir</text>
    <text class="body" y="133"><tspan x="0">Tutorial, quiz e flashcards.</tspan><tspan x="0" dy="21">Citações para abrir e conferir.</tspan><tspan x="0" dy="21">Progresso validado no backend.</tspan></text>
    <text class="micro" y="218">MATERIAL + FONTES + PRÁTICA</text>
  </g>
  <rect x="44" y="506" width="1110" height="86" rx="14" fill="#161419" stroke="#3A323E"/>
  <g class="icon" transform="translate(66 529)"><path d="M24 1A20 20 0 1 0 37 31 19 19 0 0 1 24 1" stroke="#B8A6F4"/><path class="star" d="M40 1v12 M34 7h12" stroke="#B8A6F4"/></g>
  <text x="130" y="539" class="heading" font-size="20">Dreamer · aprender com experiências consentidas</text>
  <text x="130" y="566" class="body">Consolidar → avaliar propostas → versionar ou reverter. Promoções dependem de evidência.</text>
  <text class="body" x="44" y="622" font-size="12">Com LLM configurada: geração remota. Sem LLM: modo extrativo identificado. Jev e busca web exigem configuração.</text>
  <text class="micro" x="1154" y="642" text-anchor="end">ILUSTRAÇÃO DO FLUXO · NÃO É TELEMETRIA</text>
</svg>
