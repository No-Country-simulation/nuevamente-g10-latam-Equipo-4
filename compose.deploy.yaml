# Prebuilt AMD64 images only. Build on GitHub Actions; never on the 4 GB runtime.
name: novamente-atlas
services:
  web:
    image: ${ATLAS_IMAGE_PREFIX:?Set the lowercase GHCR repository}/atlas-web:${ATLAS_IMAGE_TAG:?Use the full published Git SHA}
    environment:
      ATLAS_API_URL: http://api:4000
      ATLAS_INTERNAL_TOKEN: ${ATLAS_INTERNAL_TOKEN:?Configure the private server env}
      NODE_OPTIONS: --max-old-space-size=256
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          "-e",
          "fetch('http://127.0.0.1:3000/api/atlas/bootstrap').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    mem_limit: 384m
    cpus: 0.75
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  api:
    image: ${ATLAS_IMAGE_PREFIX:?Set the lowercase GHCR repository}/atlas-api:${ATLAS_IMAGE_TAG:?Use the full published Git SHA}
    env_file: .env
    environment:
      ATLAS_BIND_ADDRESS: 0.0.0.0
      ATLAS_DATA_DIR: /data
      COGNITION_URL: http://cognition:8000
      NODE_OPTIONS: --max-old-space-size=256
    volumes: [atlas-data:/data]
    depends_on:
      cognition: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          "-e",
          "fetch('http://127.0.0.1:4000/v1/bootstrap',{headers:{Authorization:'Bearer '+process.env.ATLAS_INTERNAL_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  cognition:
    image: ${ATLAS_IMAGE_PREFIX:?Set the lowercase GHCR repository}/atlas-cognition:${ATLAS_IMAGE_TAG:?Use the full published Git SHA}
    env_file: .env
    environment:
      ATLAS_DATA_DIR: /data
      ATLAS_API_URL: http://api:4000
    volumes: [atlas-data:/data]
    healthcheck:
      test:
        [
          CMD,
          python,
          "-c",
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)',
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    mem_limit: 896m
    cpus: 1
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
  eve:
    profiles: [agents]
    image: ${ATLAS_IMAGE_PREFIX:?Set the lowercase GHCR repository}/atlas-eve:${ATLAS_IMAGE_TAG:?Use the full published Git SHA}
    env_file: .env
    environment:
      ATLAS_DATA_DIR: /data
      ATLAS_API_URL: http://api:4000
      NODE_OPTIONS: --max-old-space-size=640
    volumes: [atlas-data:/data, eve-workflow:/app/apps/api/.eve/.workflow-data]
    healthcheck:
      test:
        [
          CMD,
          node,
          "-e",
          "fetch('http://127.0.0.1:2000/eve/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    mem_limit: 896m
    cpus: 0.75
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 5m, max-file: "2" } }
volumes:
  atlas-data:
  eve-workflow:
