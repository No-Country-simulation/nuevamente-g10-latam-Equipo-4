name: novamente-atlas
services:
  web:
    build: {context: ., dockerfile: infra/Dockerfile.node, target: web, secrets: [atlas_ca]}
    environment:
      ATLAS_API_URL: http://api:4000
      ATLAS_INTERNAL_TOKEN: ${ATLAS_INTERNAL_TOKEN:?Execute scripts/setup.sh para criar o token interno}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/atlas/bootstrap').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    mem_limit: 768m
    cpus: 0.75
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  api:
    build: {context: ., dockerfile: infra/Dockerfile.node, target: api, secrets: [atlas_ca]}
    env_file: .env
    environment:
      ATLAS_BIND_ADDRESS: 0.0.0.0
      COGNITION_URL: http://cognition:8000
    depends_on:
      cognition: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/v1/bootstrap',{headers:{Authorization:'Bearer '+process.env.ATLAS_INTERNAL_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
  cognition:
    build: {context: ., dockerfile: infra/Dockerfile.cognition, secrets: [atlas_ca]}
    env_file: .env
    environment:
      ATLAS_DATA_DIR: /data
      ATLAS_API_URL: http://api:4000
    volumes: [atlas-data:/data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    mem_limit: 1536m
    cpus: 1.0
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
volumes:
  atlas-data:
secrets:
  atlas_ca:
    file: ${ATLAS_BUILD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
